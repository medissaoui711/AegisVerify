name: 🐛 Bug Report
description: Create a report to help us improve AegisVerify
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: 1. Input "..." 2. Click Verify 3. See error
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, Browser, OS
      placeholder: Node.js 20.x, Chrome 128, macOS
